name: Collect GMFREN engagement data

on:
  schedule:
    # Hourly: replies (cheap) + likers/retweeters for posts from the last 48h only.
    - cron: "5 * * * *"
    # Once a day at 03:05 UTC: full 30-day sweep of likers/retweeters.
    - cron: "5 3 * * *"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "hourly or daily"
        required: false
        default: "hourly"

permissions:
  contents: write

concurrency:
  group: gmfren-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.run_mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "5 3 * * *" ]; then
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          else
            echo "mode=hourly" >> "$GITHUB_OUTPUT"
          fi

      - name: Run collector
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_ACCOUNT_USERNAME: ${{ vars.X_ACCOUNT_USERNAME || 'gmfrenmeme' }}
          BUDGET_MONTH_USD: ${{ vars.BUDGET_MONTH_USD || '15' }}
          RUN_MODE: ${{ steps.mode.outputs.mode }}
        run: npm run collect

      - name: Commit updated data
        run: |
          git config user.name "gmfren-leaderboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/history.json data/meta.json data/_cache/post_engagement.json
          git diff --cached --quiet || git commit -m "chore: update leaderboard data [skip ci]"
          git push
